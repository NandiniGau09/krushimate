
{% extends "base.html" %}
{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .crops-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    flex-wrap: wrap;
    gap: 15px;
  }
  .crops-header h2 {
    color: #1a472a;
    font-size: 28px;
    margin: 0;
  }
  .crops-header p {
    color: #6b7280;
    margin: 5px 0 0;
  }
  .crops-container {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 25px;
  }
  @media (max-width: 900px) {
    .crops-container { grid-template-columns: 1fr; }
  }
  .crop-form-card {
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    height: fit-content;
  }
  .crop-form-card h3 {
    color: #1a472a;
    margin-bottom: 20px;
    font-size: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    margin-bottom: 8px;
    color: #374151;
    font-weight: 500;
    font-size: 14px;
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    font-size: 14px;
    transition: all 0.3s ease;
    font-family: 'Poppins', sans-serif;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none;
    border-color: #2d5a3f;
    box-shadow: 0 0 0 4px rgba(45, 90, 63, 0.1);
  }
  .btn-add {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #2d5a3f, #4a7c59);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-add:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(45, 90, 63, 0.4);
  }
  .crops-list-card {
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
  }
  .crops-list-card h3 {
    color: #1a472a;
    margin-bottom: 20px;
    font-size: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .crop-table {
    width: 100%;
    border-collapse: collapse;
  }
  .crop-table th {
    background: #f3f4f6;
    color: #374151;
    font-weight: 600;
    text-align: left;
    padding: 14px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .crop-table th:first-child { border-radius: 10px 0 0 10px; }
  .crop-table th:last-child { border-radius: 0 10px 10px 0; }
  .crop-table td {
    padding: 14px;
    border-bottom: 1px solid #e5e7eb;
    color: #4b5563;
    font-size: 14px;
  }
  .crop-table tr:hover {
    background: #f9fafb;
  }
  .status-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }
  .status-growing { background: #d1fae5; color: #065f46; }
  .status-harvested { background: #fef3c7; color: #92400e; }
  .status-planned { background: #dbeafe; color: #1e40af; }
  .action-btns {
    display: flex;
    gap: 8px;
  }
  .btn-edit, .btn-delete {
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.3s ease;
  }
  .btn-edit {
    background: #dbeafe;
    color: #1e40af;
  }
  .btn-edit:hover {
    background: #bfdbfe;
  }
  .btn-delete {
    background: #fee2e2;
    color: #dc2626;
  }
  .btn-delete:hover {
    background: #fecaca;
  }
  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: #9ca3af;
  }
  .empty-state-icon {
    font-size: 50px;
    margin-bottom: 15px;
  }
  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal.show { display: flex; }
  .modal-content {
    background: white;
    border-radius: 20px;
    padding: 30px;
    width: 90%;
    max-width: 500px;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
  }
  .modal-header h3 {
    color: #1a472a;
    margin: 0;
  }
  .modal-close {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: #6b7280;
  }
  .btn-update {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #2d5a3f, #4a7c59);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .btn-update:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(45, 90, 63, 0.4);
  }
  .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 15px 25px;
    border-radius: 12px;
    color: white;
    font-weight: 500;
    z-index: 2000;
    animation: slideIn 0.3s ease;
    display: none;
  }
  .toast.show { display: block; }
  .toast-success { background: #10b981; }
  .toast-error { background: #ef4444; }
  @keyframes slideIn {
    from { transform: translateX(100px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
</style>

<div class="crops-header">
  <div>
    <h2>🌾 Manage Crops</h2>
    <p>Track and manage all your farm crops</p>
  </div>
</div>

<div class="crops-container">
  <div class="crop-form-card">
    <h3>➕ Add New Crop</h3>
    <form id="cropForm">
      <div class="form-group">
        <label>Crop Name</label>
        <input type="text" id="cropName" placeholder="e.g., Wheat, Rice, Tomato" required>
      </div>
      <div class="form-group">
        <label>Date of Sowing</label>
        <input type="date" id="cropSowingDate" required>
      </div>
      <div class="form-group">
        <label>Expected Harvest Date</label>
        <input type="date" id="cropHarvestDate">
      </div>
      <div class="form-group">
        <label>Area (Acres)</label>
        <input type="number" id="cropArea" placeholder="e.g., 5" step="0.1" required>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="cropStatus">
          <option value="Growing">🌱 Growing</option>
          <option value="Planned">📅 Planned</option>
          <option value="Harvested">🌾 Harvested</option>
        </select>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="cropNotes" rows="3" placeholder="Additional notes about the crop..."></textarea>
      </div>
      <button type="submit" class="btn-add">➕ Add Crop</button>
    </form>
  </div>

  <div class="crops-list-card">
    <h3>📋 Your Crops</h3>
    <table class="crop-table" id="cropTable">
      <thead>
        <tr>
          <th>Crop</th>
          <th>Sowing Date</th>
          <th>Harvest Date</th>
          <th>Area</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="cropTableBody">
      </tbody>
    </table>
    <div class="empty-state" id="emptyState">
      <div class="empty-state-icon">🌱</div>
      <p>No crops added yet</p>
      <p style="font-size: 13px">Add your first crop using the form</p>
    </div>
  </div>
</div>

<div class="modal" id="editModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>✏️ Edit Crop</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <form id="editForm">
      <input type="hidden" id="editCropId">
      <div class="form-group">
        <label>Crop Name</label>
        <input type="text" id="editCropName" required>
      </div>
      <div class="form-group">
        <label>Date of Sowing</label>
        <input type="date" id="editCropSowingDate" required>
      </div>
      <div class="form-group">
        <label>Expected Harvest Date</label>
        <input type="date" id="editCropHarvestDate">
      </div>
      <div class="form-group">
        <label>Area (Acres)</label>
        <input type="number" id="editCropArea" step="0.1" required>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="editCropStatus">
          <option value="Growing">🌱 Growing</option>
          <option value="Planned">📅 Planned</option>
          <option value="Harvested">🌾 Harvested</option>
        </select>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="editCropNotes" rows="3"></textarea>
      </div>
      <button type="submit" class="btn-update">✅ Update Crop</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
async function loadCrops() {
  try {
    const response = await fetch('/api/user_crops', {
      headers: { 'Content-Type': 'application/json' }
    });
    if (response.status === 401) {
      window.location.href = '/login';
      return [];
    }
    const result = await response.json();
    if (result.status === 'error') {
      showToast(result.message, 'error');
      return [];
    }
    return result;
  } catch (error) {
    showToast('Failed to load crops', 'error');
    return [];
  }
}

async function saveCrop(cropData) {
  try {
    const response = await fetch('/api/user_crops', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cropData)
    });
    if (response.status === 401) {
      window.location.href = '/login';
      return false;
    }
    return response.ok;
  } catch {
    return false;
  }
}

async function updateCrop(cropId, cropData) {
  try {
    const response = await fetch(`/api/user_crops/${cropId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cropData)
    });
    if (response.status === 401) {
      window.location.href = '/login';
      return false;
    }
    return response.ok;
  } catch {
    return false;
  }
}

async function removeCrop(cropId) {
  try {
    const response = await fetch(`/api/user_crops/${cropId}`, { method: 'DELETE' });
    if (response.status === 401) {
      window.location.href = '/login';
      return false;
    }
    return response.ok;
  } catch {
    return false;
  }
}

let crops = [];

async function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast toast-' + type + ' show';
  setTimeout(() => toast.classList.remove('show'), 3000);
}

async function renderCrops() {
  const tbody = document.getElementById('cropTableBody');
  const emptyState = document.getElementById('emptyState');
  
  crops = await loadCrops();
  
  if (crops.length === 0) {
    tbody.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }
  
  emptyState.style.display = 'none';
  tbody.innerHTML = crops.map((crop) => {
    let statusClass = '';
    let statusText = '';
    if (crop.status === 'Growing') {
      statusClass = 'status-growing';
      statusText = '🌱 Growing';
    } else if (crop.status === 'Harvested') {
      statusClass = 'status-harvested';
      statusText = '🌾 Harvested';
    } else {
      statusClass = 'status-planned';
      statusText = '📅 Planned';
    }
    
    return `
      <tr>
        <td><strong>${crop.name}</strong></td>
        <td>${crop.sowingDate || '-'}</td>
        <td>${crop.harvestDate || '-'}</td>
        <td>${crop.area} acres</td>
        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
        <td>
          <div class="action-btns">
            <button class="btn-edit" onclick="editCrop(${crop.id})">✏️</button>
            <button class="btn-delete" onclick="deleteCrop(${crop.id})">🗑️</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

document.getElementById('cropForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const newCrop = {
    name: document.getElementById('cropName').value,
    sowingDate: document.getElementById('cropSowingDate').value,
    harvestDate: document.getElementById('cropHarvestDate').value,
    area: document.getElementById('cropArea').value,
    status: document.getElementById('cropStatus').value,
    notes: document.getElementById('cropNotes').value
  };
  
  if (await saveCrop(newCrop)) {
    renderCrops();
    window.dispatchEvent(new CustomEvent('cropsUpdated'));
    document.getElementById('cropForm').reset();
    showToast('Crop added successfully!');
  } else {
    showToast('Failed to save crop', 'error');
  }
});

async function deleteCrop(cropId) {
  if (confirm('Are you sure you want to delete this crop?')) {
    if (await removeCrop(cropId)) {
      renderCrops();
      window.dispatchEvent(new CustomEvent('cropsUpdated'));
      showToast('Crop deleted!', 'error');
    } else {
      showToast('Failed to delete crop', 'error');
    }
  }
}

async function editCrop(cropId) {
  const crop = crops.find(c => c.id === cropId);
  if (!crop) return;
  
  document.getElementById('editCropId').value = cropId;
  document.getElementById('editCropName').value = crop.name;
  document.getElementById('editCropSowingDate').value = crop.sowingDate;
  document.getElementById('editCropHarvestDate').value = crop.harvestDate;
  document.getElementById('editCropArea').value = crop.area;
  document.getElementById('editCropStatus').value = crop.status;
  document.getElementById('editCropNotes').value = crop.notes || '';
  document.getElementById('editModal').classList.add('show');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('show');
}

document.getElementById('editForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const cropId = parseInt(document.getElementById('editCropId').value);
  const updatedCrop = {
    name: document.getElementById('editCropName').value,
    sowingDate: document.getElementById('editCropSowingDate').value,
    harvestDate: document.getElementById('editCropHarvestDate').value,
    area: document.getElementById('editCropArea').value,
    status: document.getElementById('editCropStatus').value,
    notes: document.getElementById('editCropNotes').value
  };
  
  if (await updateCrop(cropId, updatedCrop)) {
    renderCrops();
    window.dispatchEvent(new CustomEvent('cropsUpdated'));
    closeModal();
    showToast('Crop updated successfully!');
  } else {
    showToast('Failed to update crop', 'error');
  }
});

document.getElementById('editModal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('editModal')) {
    closeModal();
  }
});

renderCrops();
</script>
{% endblock %}
