{% extends "base.html" %}
{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
  .gallery-header {
    text-align: center;
    margin-bottom: 40px;
  }
  .gallery-title {
    font-size: 3rem;
    background: linear-gradient(135deg, #2d5a3f, #4a7c59);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
    font-weight: 700;
  }
  .gallery-subtitle {
    color: #6b7280;
    font-size: 1.2rem;
  }
  .upload-zone {
    background: rgba(255,255,255,0.95);
    border-radius: 24px;
    padding: 50px;
    margin-bottom: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    backdrop-filter: blur(20px);
    text-align: center;
    transition: all 0.3s ease;
  }
  .upload-zone:hover { transform: translateY(-5px); }
  .upload-circle {
    width: 120px;
    height: 120px;
    background: linear-gradient(135deg, #2d5a3f, #4a7c59);
    border-radius: 50%;
    margin: 0 auto 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    color: white;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .upload-circle:hover {
    transform: scale(1.1) rotate(10deg);
    box-shadow: 0 20px 40px rgba(45,90,63,0.4);
  }
  .upload-text {
    font-size: 1.4rem;
    font-weight: 600;
    color: #1a472a;
    margin-bottom: 8px;
  }
  .upload-hint {
    color: #6b7280;
    font-size: 1rem;
  }
  #farmFileInput { display: none; }
  
  .masonry-grid {
    column-count: 1;
    column-gap: 25px;
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 20px;
  }
  @media (min-width: 768px) { .masonry-grid { column-count: 2; } }
  @media (min-width: 1200px) { .masonry-grid { column-count: 3; } }
  
  .photo-card {
    break-inside: avoid;
    margin-bottom: 25px;
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0,0,0,0.1);
    transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    cursor: pointer;
    background: #fff;
  }
  .photo-card:hover {
    transform: translateY(-15px);
    box-shadow: 0 30px 60px rgba(0,0,0,0.2);
  }
  .photo-card img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    transition: transform 0.4s ease;
  }
  .photo-card:hover img {
    transform: scale(1.05);
  }
  .card-footer {
    padding: 20px;
    background: rgba(255,255,255,0.95);
  }
  .photo-date {
    color: #6b7280;
    font-size: 0.85rem;
    margin-bottom: 5px;
  }
  .delete-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(239,68,68,0.9);
    color: white;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 10;
  }
  .photo-card:hover .delete-btn {
    opacity: 1;
    transform: scale(1.1);
  }
  
  .lightbox {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
  }
  .lightbox.active {
    opacity: 1;
    visibility: visible;
  }
  .lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 20px;
    box-shadow: 0 0 100px rgba(255,255,255,0.3);
  }
  .close-lightbox {
    position: absolute;
    top: 40px;
    right: 40px;
    background: rgba(255,255,255,0.2);
    border: none;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    color: white;
    font-size: 1.8rem;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .close-lightbox:hover { background: rgba(255,255,255,0.4); transform: rotate(90deg); }
  
  .upload-progress {
    margin-top: 20px;
    background: #e5e7eb;
    border-radius: 10px;
    height: 8px;
    overflow: hidden;
    display: none;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #2d5a3f, #4a7c59);
    width: 0%;
    transition: width 0.3s ease;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 20px;
    margin: 20px 0;
    padding: 20px;
    background: rgba(255,255,255,0.9);
    border-radius: 16px;
  }
  .stat-card {
    text-align: center;
    padding: 20px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
  }
  .stat-number { 
    font-size: 2.5rem;
    font-weight: 700;
    background: linear-gradient(135deg, #2d5a3f, #4a7c59);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .stat-label { 
    color: #6b7280;
    font-size: 0.9rem;
    margin-top: 5px;
  }
  .empty-gallery {
    text-align: center;
    padding: 100px 40px;
    color: #9ca3af;
  }
  .empty-icon {
    font-size: 8rem;
    margin-bottom: 30px;
    opacity: 0.5;
  }
  @keyframes bounce {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-10px); }
    60% { transform: translateY(-5px); }
  }
  .upload-circle.bounce { animation: bounce 2s infinite; }
  
  .floating-badge {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: linear-gradient(135deg, #2d5a3f, #4a7c59);
    color: white;
    border: none;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    font-size: 1.5rem;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(45,90,63,0.4);
    z-index: 100;
    transition: all 0.3s ease;
  }
  .floating-badge:hover { transform: scale(1.1); }
</style>

<div class="gallery-header">
  <h1 class="gallery-title">🌿 Farm Memories Gallery</h1>
  <p class="gallery-subtitle">Showcase your beautiful farm journey with photos</p>
</div>

<div class="stats-grid" id="statsGrid">
  <div class="stat-card">
    <div class="stat-number" id="photoCount">0</div>
    <div class="stat-label"><i class="fas fa-images"></i> Total Photos</div>
  </div>
  <div class="stat-card">
    <div class="stat-number" id="storageUsed">0 MB</div>
    <div class="stat-label"><i class="fas fa-hdd"></i> Storage</div>
  </div>
</div>

<div class="upload-zone" id="uploadZone">
  <div class="upload-circle" id="uploadTrigger">
    <i class="fas fa-cloud-upload-alt"></i>
  </div>
  <div class="upload-text">Upload Farm Photos</div>
  <div class="upload-hint">Drag & drop or click • JPG, PNG • Max 10MB</div>
  <div class="upload-progress" id="uploadProgress">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <input type="file" id="photoInput" multiple accept="image/jpeg,image/png">
</div>

<div class="masonry-grid" id="photoGrid"></div>

<div class="empty-gallery" id="emptyState">
  <div class="empty-icon">
    <i class="fas fa-images"></i>
  </div>
  <h2>No farm photos yet</h2>
  <p>Start documenting your farm journey! 📸</p>
</div>

<button class="floating-badge" onclick="scrollToTop()" title="Back to top">
  <i class="fas fa-arrow-up"></i>
</button>

<script>
let farmPhotos = [];
const uploadZone = document.getElementById('uploadZone');
const uploadTrigger = document.getElementById('uploadTrigger');
const photoInput = document.getElementById('photoInput');
const photoGrid = document.getElementById('photoGrid');
const emptyState = document.getElementById('emptyState');
const statsGrid = document.getElementById('statsGrid');
const uploadProgress = document.getElementById('uploadProgress');

uploadTrigger.onclick = () => photoInput.click();
photoInput.onchange = handleFiles;
uploadZone.ondragover = e => { e.preventDefault(); uploadZone.classList.add('dragover'); };
uploadZone.ondragleave = () => uploadZone.classList.remove('dragover');
uploadZone.ondrop = handleDrop;

async function loadGallery() {
  try {
    const res = await fetch('/api/user_farm_images');
    if (res.status === 401) {
      window.location.href = '/login';
      return;
    }
    farmPhotos = await res.json();
    renderGallery();
    updateStats();
  } catch (e) {
    console.error('Load failed:', e);
  }
}

function renderGallery() {
  if (farmPhotos.length === 0) {
    photoGrid.innerHTML = '';
    emptyState.style.display = 'block';
    statsGrid.style.display = 'none';
    return;
  }
  
  statsGrid.style.display = 'grid';
  emptyState.style.display = 'none';
  
  photoGrid.innerHTML = farmPhotos.map(photo => `
    <div class="photo-card" onclick="openLightbox('${photo.url}')">
      <img src="${photo.url}" alt="${photo.name}" loading="lazy">
      <button class="delete-btn" onclick="deletePhoto(event, '${photo.id}')">
        <i class="fas fa-trash"></i>
      </button>
      <div class="card-footer">
        <div class="photo-date">${new Date(photo.created_at).toLocaleDateString()}</div>
      </div>
    </div>
  `).join('');
}

async function deletePhoto(e, id) {
  e.stopPropagation();
  if (confirm('Delete this photo?')) {
    try {
      const response = await fetch(`/api/user_farm_images/${id}`, { method: 'DELETE' });
      if (!response.ok) {
        throw new Error('Delete failed');
      }
      loadGallery();
      showToast('Photo deleted!');
    } catch {
      showToast('Delete failed', 'error');
    }
  }
}

function openLightbox(url) {
  const lightbox = document.createElement('div');
  lightbox.className = 'lightbox active';
  lightbox.innerHTML = `
    <button class="close-lightbox" onclick="this.parentElement.remove()">&times;</button>
    <img src="${url}" alt="Farm photo">
  `;
  lightbox.onclick = e => e.target === lightbox && lightbox.remove();
  document.body.appendChild(lightbox);
}

function updateStats() {
  document.getElementById('photoCount').textContent = farmPhotos.length;
  const totalSize = farmPhotos.reduce((sum, p) => sum + p.size, 0);
  document.getElementById('storageUsed').textContent = (totalSize / (1024*1024)).toFixed(1) + ' MB';
}

async function handleFiles() {
  const files = Array.from(photoInput.files);
  if (files.length === 0) return;
  
  const formData = new FormData();
  files.forEach(file => formData.append('images', file));
  
  uploadProgress.style.display = 'block';
  let progress = 0;
  const progressFill = document.getElementById('progressFill');
  
  try {
    const res = await fetch('/api/upload_farm_images', {
      method: 'POST',
      body: formData
    });
    if (res.status === 401) {
      window.location.href = '/login';
      return;
    }
    
    const result = await res.json();
    if (result.status === 'ok') {
      loadGallery();
      showToast(`${result.count || 0} photos uploaded!`);
    } else {
      showToast(result.message || 'Upload failed', 'error');
    }
  } catch (e) {
    showToast('Upload error', 'error');
  } finally {
    uploadProgress.style.display = 'none';
    photoInput.value = '';
  }
}

function handleDrop(e) {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  photoInput.files = e.dataTransfer.files;
  handleFiles();
}

function showToast(msg, type = 'success') {
  if (window.parent && window.parent.showToast) {
    window.parent.showToast(msg, type);
  }
}

function scrollToTop() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Init
loadGallery();
</script>
{% endblock %}
