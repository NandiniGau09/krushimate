
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - Krushimate</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a472a 0%, #2d5a3f 50%, #1a472a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }
    body::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      animation: drift 20s linear infinite;
    }
    @keyframes drift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(30px, 30px); }
    }
    .login-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 50px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
      position: relative;
      backdrop-filter: blur(10px);
    }
    .brand {
      text-align: center;
      margin-bottom: 35px;
    }
    .brand-logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #2d5a3f, #4a7c59);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 36px;
      font-weight: bold;
      color: white;
      box-shadow: 0 10px 30px rgba(45, 90, 63, 0.4);
    }
    .brand h1 {
      color: #1a472a;
      font-size: 28px;
      margin-bottom: 5px;
    }
    .brand p {
      color: #6b7280;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #374151;
      font-weight: 500;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 15px;
      transition: all 0.3s ease;
      background: #f9fafb;
    }
    .form-group input:focus {
      outline: none;
      border-color: #2d5a3f;
      background: white;
      box-shadow: 0 0 0 4px rgba(45, 90, 63, 0.1);
    }
    .form-group input::placeholder {
      color: #9ca3af;
    }
    .btn-login {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #2d5a3f, #4a7c59);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 90, 63, 0.4);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 25px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }
    .divider span {
      padding: 0 15px;
      color: #9ca3af;
      font-size: 13px;
    }
    .register-link {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
    }
    .register-link a {
      color: #2d5a3f;
      font-weight: 600;
      text-decoration: none;
    }
    .register-link a:hover {
      text-decoration: underline;
    }
    .features {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
    }
    .feature-item {
      text-align: center;
      color: #6b7280;
      font-size: 12px;
    }
    .feature-icon {
      font-size: 20px;
      margin-bottom: 5px;
    }
    .error-msg {
      background: #fee2e2;
      color: #dc2626;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="brand">
      <div class="brand-logo">🌾</div>
      <h1>Krushimate</h1>
      <p>Smart Farming Solutions</p>
    </div>
    
    <div class="error-msg" id="errorMsg"></div>
    
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="login_username" placeholder="Enter your username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login_password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
    </form>
    
    <p class="register-link" style="margin-top: 20px; text-align: center;">
      Don't have an account? <a href="/register">Create Account</a>
    </p>
  </div>
  
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login_username').value;
      const password = document.getElementById('login_password').value;
      const errorMsg = document.getElementById('errorMsg');
      const loginBtn = document.getElementById('loginBtn');
      
      // Show loading state
      loginBtn.textContent = 'Loading...';
      loginBtn.disabled = true;
      errorMsg.style.display = 'none';
      
      console.log('Login attempt:', username);
      
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        console.log('Response:', data);
        
        if (data.status === 'ok') {
          console.log('Login successful, redirecting...');
          localStorage.setItem('user', JSON.stringify(data.user));
          // Direct redirect without alert
          window.location.replace('/dashboard');
          return;
        } else {
          errorMsg.textContent = data.message || 'Invalid credentials';
          errorMsg.style.display = 'block';
          loginBtn.textContent = 'Sign In';
          loginBtn.disabled = false;
        }
      } catch (err) {
        console.error('Error:', err);
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.style.display = 'block';
        loginBtn.textContent = 'Sign In';
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
