
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register - Krushimate</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a472a 0%, #2d5a3f 50%, #1a472a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-y: auto;
    }
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      animation: drift 20s linear infinite;
    }
    @keyframes drift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(30px, 30px); }
    }
    .register-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
      position: relative;
      backdrop-filter: blur(10px);
      margin: 20px 0;
    }
    .brand {
      text-align: center;
      margin-bottom: 30px;
    }
    .brand-logo {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #2d5a3f, #4a7c59);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 32px;
    }
    .brand h1 {
      color: #1a472a;
      font-size: 26px;
      margin-bottom: 5px;
    }
    .brand p {
      color: #6b7280;
      font-size: 14px;
    }
    .form-row {
      display: flex;
      gap: 15px;
    }
    .form-group {
      margin-bottom: 18px;
      flex: 1;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #374151;
      font-weight: 500;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 15px;
      transition: all 0.3s ease;
      background: #f9fafb;
    }
    .form-group input:focus {
      outline: none;
      border-color: #2d5a3f;
      background: white;
      box-shadow: 0 0 0 4px rgba(45, 90, 63, 0.1);
    }
    .form-group input::placeholder {
      color: #9ca3af;
    }
    .btn-register {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #2d5a3f, #4a7c59);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }
    .btn-register:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 90, 63, 0.4);
    }
    .login-link {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-top: 20px;
    }
    .login-link a {
      color: #2d5a3f;
      font-weight: 600;
      text-decoration: none;
    }
    .login-link a:hover {
      text-decoration: underline;
    }
    .error-msg {
      background: #fee2e2;
      color: #dc2626;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      display: none;
    }
    .success-msg {
      background: #d1fae5;
      color: #065f46;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="brand">
      <div class="brand-logo">🌾</div>
      <h1>Join Krushimate</h1>
      <p>Create Your Farmer Account</p>
    </div>
    
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>
    
    <form id="registerForm">
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="first_name" placeholder="First name" required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="last_name" placeholder="Last name" required>
        </div>
      </div>
      <div class="form-group">
        <label>City</label>
        <input type="text" id="city" placeholder="Your city" required>
      </div>
      <div class="form-group">
        <label>Contact Number</label>
        <input type="tel" id="contact" placeholder="Phone number" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Choose a username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Create password" required>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirm_password" placeholder="Confirm password" required>
      </div>
      <button type="submit" class="btn-register">Create Account</button>
    </form>
    
    <p class="login-link">
      Already have an account? <a href="/login">Sign In</a>
    </p>
  </div>
  
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const first_name = document.getElementById('first_name').value;
      const last_name = document.getElementById('last_name').value;
      const city = document.getElementById('city').value;
      const contact = document.getElementById('contact').value;
      const email = document.getElementById('email').value;
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const confirm_password = document.getElementById('confirm_password').value;
      
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');
      
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      
      if (password !== confirm_password) {
        errorMsg.textContent = 'Passwords do not match!';
        errorMsg.style.display = 'block';
        return;
      }
      
      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            first_name, last_name, city, contact, email, username, password, confirm_password
          })
        });
        
        const data = await response.json();
        
        if (data.status === 'ok') {
          successMsg.textContent = 'Account created! Redirecting to login...';
          successMsg.style.display = 'block';
          setTimeout(() => {
            window.location.href = '/login';
          }, 1500);
        } else {
          errorMsg.textContent = data.message || 'Registration failed';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
